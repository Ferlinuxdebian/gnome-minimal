# /etc/systemd/system/tuned-ppd.service.d/10-retry.conf
#
# O tuned-ppd pode falhar no primeiro boot se o tuned.service ainda estiver
# inicializando ou se houver uma negação do SELinux durante a inicialização.
# Com o retry, o serviço tenta novamente em vez de ficar como "failed".
[Service]
Restart=on-failure
RestartSec=10s
