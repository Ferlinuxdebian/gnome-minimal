# /usr/lib/bootc/kargs.d/20-plymouth.toml
#
# Exibe a tela de boot gráfica do Plymouth.
#
# O Plymouth já é instalado pela lista pacotes_desktop, mas ele só mostra o
# splash quando o kernel recebe os argumentos abaixo:
#
#   rhgb  -> pede o boot gráfico (Red Hat Graphical Boot); é o argumento que
#           faz o Plymouth assumir a tela em vez do console.
#   quiet -> esconde as mensagens do kernel e dos serviços durante o boot.
#
# Sem esses argumentos o Plymouth fica instalado, porém inativo, e o boot
# mostra apenas texto. O bootc aplica estes kargs ao instalar e ao atualizar
# o sistema (bootc upgrade/switch).
kargs = ["rhgb", "quiet"]
