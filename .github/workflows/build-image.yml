name: Build e Push da Imagem Bootc e ISO
on:
  schedule:
    - cron: '45 6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ferlinuxdebian/bootc-gnome-minimal
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Liberar espaço no disco (Disk Cleanup)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/lib/jvm
          sudo apt-get clean
          echo "Espaço após a limpeza:"
          df -h

      - name: Extrair Versão da Imagem Base
        id: base_version
        run: |
          VERSION=$(grep '^FROM' Containerfile | head -n 1 | awk -F: '{print $2}' | awk '{print $1}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Gerar Timestamp (Horário de Brasília)
        id: timestamp
        run: echo "date=$(TZ='America/Sao_Paulo' date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Login no GitHub Container Registry via Buildah
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo buildah login \
            -u ${{ github.actor }} \
            --password-stdin \
            ${{ env.REGISTRY }}

      - name: Build da Imagem com Buildah
        run: |
          sudo buildah build \
            --skip-unused-stages=false \
            --security-opt=label=disable \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.base_version.outputs.version }}-${{ steps.timestamp.outputs.date }}" \
            -f Containerfile \
            -v $(pwd):/run/src \
            .

      - name: Aplicar Tags Adicionais
        run: |
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.base_version.outputs.version }}-${{ steps.timestamp.outputs.date }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sudo buildah tag "${SOURCE}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.base_version.outputs.version }}-latest"
          sudo buildah tag "${SOURCE}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          sudo buildah tag "${SOURCE}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          sudo buildah tag "${SOURCE}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"

      - name: Push de Todas as Tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${{ steps.base_version.outputs.version }}"
          DATE="${{ steps.timestamp.outputs.date }}"
          for TAG in "${VERSION}-${DATE}" "${VERSION}-latest" "latest" "main" "sha-${SHORT_SHA}"; do
            echo "→ Pushing ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
            sudo buildah push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          done

      - name: Gerar ISO com Bootc Image Builder
        run: |
          mkdir -p ./output
          touch config.toml 
          
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=disable \
            -v ./output:/output \
            -v ./config.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Upload da ISO como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: bootc-gnome-iso-${{ steps.timestamp.outputs.date }}
          path: ./output/bootc-gnome-minimal.iso
          if-no-files-found: warn
