# ============================================================================
#  CONFIGURAÇÃO DA IMAGEM — edite este arquivo e publique uma nova imagem
# ============================================================================
#
#  Este é o único arquivo que você precisa editar para personalizar a imagem.
#  Depois de editar:
#    1. faça commit e push na branch main (o build começa sozinho); ou
#    2. no GitHub, abra Actions → "Build e Push da Imagem Bootc" → Run workflow
#       para disparar o build manualmente (útil para reconstruir sem mudar nada).
#
#  Regras gerais:
#    - linhas que começam com # são comentários;
#    - não use espaços dentro dos nomes de pacotes ou IDs de Flatpak;
#    - as opções abaixo (antes da primeira seção) valem para o build inteiro.
# ============================================================================


# ----------------------------------------------------------------------------
#  NOME DA IMAGEM PUBLICADA NO GHCR
# ----------------------------------------------------------------------------
# O nome da imagem publicada no GitHub Container Registry (GHCR).
# COLOQUE O MESMO NOME DO REPOSÍTÓRIO QUE VOCÊ COPIO COM O TEMPLATE
#
#  Exemplo: IMAGE_NAME=seu-usuario/seu-repositorio
# ----------------------------------------------------------------------------
IMAGE_NAME=ferlinuxdebian/gnome-minimal


# ----------------------------------------------------------------------------
#  REPOSITÓRIOS EXTRAS
# ----------------------------------------------------------------------------
#  true  = habilita o repositório durante o build
#  false = não habilita (padrão)
#
#  Os pacotes da seção [pacotes] podem vir destes repositórios.
#  Atenção: RPM Fusion e Negativo17 oferecem pacotes parecidos (por exemplo,
#  codecs e drivers). Evite habilitar os dois ao mesmo tempo sem necessidade.
# ----------------------------------------------------------------------------
RPMFUSION=false
TERRA=false
NEGATIVO17=false


# ----------------------------------------------------------------------------
#  [flatpaks] — aplicativos instalados no primeiro boot
# ----------------------------------------------------------------------------
#  Coloque somente o ID exato do aplicativo no Flathub, um por linha.
#  Para descobrir o ID: flatpak search nome-do-app
#  ou procure na página do app em https://flathub.org
#
#  Exemplo:
#    org.gnome.Calculator
# ----------------------------------------------------------------------------
[flatpaks]

# Loja de aplicativos
io.github.kolunmi.Bazaar

# Navegador
org.mozilla.firefox

# Gerenciador de extensões do GNOME
com.mattjakeman.ExtensionManager


# ----------------------------------------------------------------------------
#  [pacotes] — pacotes base do sistema
# ----------------------------------------------------------------------------
#  Um pacote por linha. Linhas com # são comentários.
#  Para procurar o nome exato de um pacote: dnf5 search nome-do-pacote
#
#  Exemplos:
#    htop
#    fastfetch
#    neovim
# 
# ESSE ABAIXO SE VOCÊ NÃO TEM EXPERIÊNCIA RECOMANDO NÃO ALTERAR
# ----------------------------------------------------------------------------
[pacotes]
@networkmanager-submodules
@multimedia
ffmpegthumbnailer
xdg-utils
compsize
langpacks-core-pt_BR
flatpak
toolbox
distrobox
git
tree
langpacks-fonts-pt
langpacks-pt_BR
tuned
tuned-ppd
zram-generator
spice-vdagent
podman
fpaste
audit
unzip
usbutils
pciutils
sysfsutils
bash-color-prompt
kmscon-freetype


# ----------------------------------------------------------------------------
#  [pacotes-desktop] — pacotes do ambiente gráfico
# ----------------------------------------------------------------------------
#  Um pacote por linha. Para trocar de ambiente gráfico, substitua os pacotes
#  do GNOME pelos do novo ambiente (KDE, XFCE etc.).
#
#  O Containerfile procura "gnome-shell" nesta lista:
#    - com gnome-shell: instala o GNOME em um passo próprio, sem dependências
#      fracas, para manter a imagem mínima;
#    - sem gnome-shell: pula esse passo automaticamente.
#
#  Por isso, se quiser KDE, XFCE etc., remova a linha gnome-shell e coloque os
#  pacotes do ambiente escolhido. Você NÃO precisa editar o Containerfile.
# ----------------------------------------------------------------------------
[pacotes-desktop]
gnome-shell
glycin-thumbnailer
gnome-epub-thumbnailer
papers-thumbnailer
adw-gtk3-theme
libnma
ibus-typing-booster
ibus-gtk4
gnome-shell-extension-appindicator
nautilus
ptyxis
gnome-backgrounds
f45-backgrounds-gnome
gnome-initial-setup

# Sons do GNOME (ex.: screenshot, alertas do terminal).
# Sem estes backends, alguns efeitos sonoros do GNOME ficam mudos.
libcanberra-backend-pulse
libcanberra-backend-gstreamer
libcanberra-backend-alsa

# Plymouth deixa o boot mais bonito. (Pode permanecer em todos os ambientes)
# Na dúvida não apague o trecho abaixo.
plymouth
plymouth-core-libs
plymouth-graphics-libs
plymouth-plugin-label
plymouth-plugin-two-step
plymouth-scripts
plymouth-system-theme
plymouth-theme-spinner
