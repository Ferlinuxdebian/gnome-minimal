# /usr/lib/tmpfiles.d/tuned-log.conf
#
# O tuned-ppd grava o log em /var/log/tuned/tuned-ppd.log. O RPM do tuned
# entrega esse diretório, mas não tem uma entrada em tmpfiles.d para ele.
#
# Como /var é criado na instalação e persiste entre atualizações, o contexto
# SELinux do diretório pode acabar como var_log_t (em vez de tuned_log_t),
# fazendo o tuned-ppd sair com status 1.
#
# Estas regras garantem, a cada boot:
#   - a criação de /var/log/tuned se ele não existir;
#   - a reaplicação do contexto SELinux correto (tuned_log_t).
d /var/log/tuned 0755 root root -
Z /var/log/tuned - - - -
